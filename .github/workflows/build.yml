# Builds the kiosk software on GitHub and publishes it as a release.
# Start it by pushing a tag that begins with v (for example v2026.11.03), or run it by hand from the Actions tab.
name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup (for the installer .exe files)
        run: choco install innosetup -y --no-progress

      - name: Build everything
        shell: pwsh
        run: .\Build.ps1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\kiosk\* -DestinationPath dist\kiosk-update.zip
          Compress-Archive -Path dist\admin\* -DestinationPath dist\admin.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          files: |
            dist/kiosk-update.zip
            dist/admin.zip
            dist/KioskSetup.exe
            dist/KioskAdminSetup.exe
